name: Generate world map assets
description: >-
  Produce the Art addon's content: the high-resolution World and continent
  maps in src/addon/art/WorldMap/, reusing the cached copy when the generator has
  not changed since it was last built.

# The output is a pure function of the generator (src/generator/generateHFWM.py,
# src/generator/hfwm/**, src/generator/requirements.txt), so that is the whole
# cache key. A release that only touches Lua, docs or workflows hits the cache
# and skips the ~40 minute build.
#
# One cache entry, mapart-v3-<hash>: src/addon/art/WorldMap, the
# high-resolution World and continent maps only (zone and cave maps are drawn
# from the game's own files), ~1 GB. FDIDMap.lua and CaveData.lua are the
# client's, committed, and are not touched here (--skip-fdid-map --no-caves).
#
# The low-resolution maps (src/addon/client/WorldMap/) are the client addon's:
# committed, not cached. The generator rewrites them on a cache miss, but
# only the high-resolution tree is saved, and the client release workflows
# never run this action. Regenerate and commit them after a generator change.
#
# GitHub scopes caches by ref: a run on a tag can read caches saved from the
# default branch but not from any other tag. So the copy that *later* releases
# restore has to be saved from main (see
# .github/workflows/generate-world-map-assets.yml and release-addon-art.yml). A
# copy saved from a tag still serves its own run, it just costs ~1 GB of the
# repo's 10 GB cache quota and is invisible to every other tag.

inputs:
  save:
    description: "Save a freshly generated build to the cache (only useful on main)."
    required: false
    default: "false"

  bypass-cache:
    description: >-
      Skip restoring the caches and regenerate the assets even when valid
      cache entries already exist.
    required: false
    default: "false"

outputs:
  cache-hit:
    description: "'true' when everything came from the cache instead of being generated."
    value: ${{ steps.decide.outputs.cache-hit }}
  art-key:
    description: "The art cache key, mapart-v3-<hash>. The hash identifies the generator build."
    value: ${{ steps.key.outputs.art-key }}

runs:
  using: composite
  steps:
    - name: Compute cache keys
      id: key
      shell: bash
      env:
        HASH: ${{ hashFiles('src/generator/generateHFWM.py', 'src/generator/hfwm/**/*.py', 'src/generator/requirements.txt') }}
      run: .github/scripts/world-map-assets-keys.sh >> "$GITHUB_OUTPUT"

    - name: Delete world map assets caches
      if: inputs.bypass-cache == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        ART_KEY: ${{ steps.key.outputs.art-key }}
      run: .github/scripts/delete-world-map-assets-cache.sh

    - name: Restore world map art cache
      id: art
      if: inputs.bypass-cache != 'true'
      uses: actions/cache/restore@v5
      with:
        path: src/addon/art/WorldMap
        key: ${{ steps.key.outputs.art-key }}

    - name: Decide what to generate
      id: decide
      shell: bash
      env:
        ART_HIT: ${{ steps.art.outputs.cache-hit }}
        BYPASS: ${{ inputs.bypass-cache }}
      run: .github/scripts/decide-world-map-assets.sh >> "$GITHUB_OUTPUT"

    - name: Set up Python
      if: steps.decide.outputs.generate == 'true'
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Install dependencies
      if: steps.decide.outputs.generate == 'true'
      shell: bash
      run: .github/scripts/install-python-deps.sh

    - name: Resolve game build
      id: pipeline
      if: steps.decide.outputs.generate == 'true'
      shell: bash
      run: python .github/scripts/resolve_game_build.py >> "$GITHUB_OUTPUT"

    # ~460 MB of DB2 exports, WDTs and minimap BLPs pulled from wago.tools.
    # Only needed when the art itself has to be rebuilt.
    - name: Restore pipeline cache
      if: steps.decide.outputs.generate == 'true'
      uses: actions/cache@v5
      with:
        path: ${{ steps.pipeline.outputs.cache_dir }}
        key: casc-${{ steps.pipeline.outputs.build }}-${{ hashFiles('src/generator/hfwm/config/*.py') }}
        restore-keys: |
          casc-${{ steps.pipeline.outputs.build }}-

    - name: Generate map art
      if: steps.decide.outputs.generate == 'true'
      shell: bash
      run: python src/generator/generateHFWM.py --no-caves --skip-fdid-map

    # Runs on cache hits too: a bad entry should fail here, not ship.
    - name: Verify world map assets
      shell: bash
      run: .github/scripts/verify-world-map-assets.sh

    # Only after verification, so a broken build is never cached. Saved only
    # if it was missing: saving an existing key just fails.
    - name: Save world map art cache
      if: inputs.save == 'true' && steps.decide.outputs.generate == 'true' && steps.art.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: src/addon/art/WorldMap
        key: ${{ steps.key.outputs.art-key }}
