name: Generate world map assets
description: >-
  Produce src/addon/WorldMap/, src/addon/FDIDMap.lua and src/addon/CaveData.lua, reusing a
  cached copy when the generator has not changed since it was last built.

# The art is a pure function of the generator (src/generator/generateHFWM.py,
# src/generator/hfwm/**, src/generator/requirements.txt), so that is the whole cache
# key. A release that only touches Lua, docs or workflows hits the cache and
# skips the ~40 minute build.
#
# GitHub scopes caches by ref: a run on a tag can read caches saved from the
# default branch but not from any other tag. So the copy that *later* releases
# restore has to be saved from main (see
# .github/workflows/generate-world-map-assets.yml). A copy
# saved from a tag still serves its own run (release.yml's art job saves it and
# the release job restores it), it just costs ~2-3 GB of the repo's 10 GB
# cache quota and is invisible to every other tag.

inputs:
  save:
    description: "Save a freshly generated build to the cache (only useful on main)."
    required: false
    default: "false"

  lookup-only:
    description: >-
      Only check whether the cache entry exists, without downloading it. On a
      hit nothing else runs. On a miss the art is generated and saved as usual.
    required: false
    default: "false"

outputs:
  cache-hit:
    description: "'true' when the art came from the cache instead of being generated."
    value: ${{ steps.art.outputs.cache-hit }}

runs:
  using: composite
  steps:
    # The tree is ~7 GB. The packager then copies it into .release/ and zips
    # that, so a stock runner's ~14 GB runs out partway through the zip.
    # Everything removed here is preinstalled tooling this job never touches.
    - name: Free disk space
      shell: bash
      run: .github/scripts/free-disk-space.sh

    - name: Restore world map assets cache
      id: art
      uses: actions/cache/restore@v5
      with:
        lookup-only: ${{ inputs.lookup-only }}
        path: |
          src/addon/WorldMap
          src/addon/FDIDMap.lua
          src/addon/CaveData.lua
        key: mapart-v2-${{ hashFiles('src/generator/generateHFWM.py', 'src/generator/hfwm/**/*.py', 'src/generator/requirements.txt') }}

    - name: Set up Python
      if: steps.art.outputs.cache-hit != 'true'
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Install dependencies
      if: steps.art.outputs.cache-hit != 'true'
      shell: bash
      run: .github/scripts/install-python-deps.sh

    - name: Resolve game build
      id: pipeline
      if: steps.art.outputs.cache-hit != 'true'
      shell: bash
      run: python .github/scripts/resolve_game_build.py >> "$GITHUB_OUTPUT"

    # ~460 MB of DB2 exports, WDTs and minimap BLPs pulled from wago.tools.
    # Only needed when the art itself has to be rebuilt.
    - name: Restore pipeline cache
      if: steps.art.outputs.cache-hit != 'true'
      uses: actions/cache@v5
      with:
        path: ${{ steps.pipeline.outputs.cache_dir }}
        key: casc-${{ steps.pipeline.outputs.build }}-${{ hashFiles('src/generator/hfwm/config/*.py') }}
        restore-keys: |
          casc-${{ steps.pipeline.outputs.build }}-

    - name: Generate map art
      if: steps.art.outputs.cache-hit != 'true'
      shell: bash
      run: python src/generator/generateHFWM.py

    # Runs on cache hits too: a bad entry should fail here, not ship. Except
    # on a lookup-only hit, where nothing was downloaded to look at.
    - name: Verify world map assets
      if: inputs.lookup-only != 'true' || steps.art.outputs.cache-hit != 'true'
      shell: bash
      run: .github/scripts/verify-world-map-assets.sh

    # Only after verification, so a broken build is never cached.
    - name: Save world map assets cache
      if: inputs.save == 'true' && steps.art.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: |
          src/addon/WorldMap
          src/addon/FDIDMap.lua
          src/addon/CaveData.lua
        key: mapart-v2-${{ hashFiles('src/generator/generateHFWM.py', 'src/generator/hfwm/**/*.py', 'src/generator/requirements.txt') }}
