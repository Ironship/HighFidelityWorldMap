name: Generate World Map Assets

# Runs the Python pipeline (src/generator/generateHFWM.py) that builds the world
# map art (src/addon/mapdata/WorldMap/), src/addon/client/FDIDMap.lua and
# src/addon/client/CaveData.lua, and saves the result to the Actions cache *from
# main*. That is the only scope a tag-triggered release can read, so every
# release (Create Release: Addon / MapData, and the publish workflows) can reuse
# it instead of repeating the ~40 minute generation. See
# .github/actions/generate-world-map-assets.
#
# Two cache entries share one key hash: the art (mapart-v2-<hash>, multi-GB,
# read only by the Map Data release) and the Lua tables (maptables-v2-<hash>,
# small, read by the core addon release). The hash covers the generator only
# (src/generator/generateHFWM.py, src/generator/hfwm/**,
# src/generator/requirements.txt). A change that leaves those alone, such as an
# addon Lua fix, docs or a workflow tweak, resolves to the same keys, so a new
# tag or manual release reuses the existing assets without regenerating anything.
#
#   - weekly: GitHub evicts caches unused for 7 days; restoring the entry
#     resets that clock. A miss here (evicted, or never built) regenerates it.
#   - manual: warm it on demand.
#
# A push to main that changes the generator is NOT handled here any more: it
# starts "Create Release: MapData", which regenerates (and caches) the art as
# its first step when the art key changed.

on:
  schedule:
    - cron: "17 4 * * 0"
  workflow_dispatch:
    inputs:
      bypass-asset-cache:
        description: "Bypass the asset cache and regenerate from scratch."
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: generate-world-map-assets
  cancel-in-progress: false

jobs:
  cache-check:
    name: Check world map asset cache
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.tables.outputs.cache-hit == 'true' && steps.art.outputs.cache-hit == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Compute cache keys
        id: key
        env:
          HASH: ${{ hashFiles('src/generator/generateHFWM.py', 'src/generator/hfwm/**/*.py', 'src/generator/requirements.txt') }}
        run: .github/scripts/world-map-assets-keys.sh >> "$GITHUB_OUTPUT"

      # A real restore, not lookup-only: restoring an entry is what resets
      # GitHub's 7-day eviction clock, which is the point of the weekly run.
      - name: Restore world map tables cache
        id: tables
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.bypass-asset-cache }}
        uses: actions/cache/restore@v5
        with:
          path: |
          src/addon/client/FDIDMap.lua
          src/addon/client/CaveData.lua
        id: art
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.bypass-asset-cache }}
        uses: actions/cache/restore@v5
        with:
          path: src/addon/mapdata/WorldMap
          key: ${{ steps.key.outputs.art-key }}

  build:
    name: Generate and cache world map assets
    needs: cache-check
    if: ${{ needs.cache-check.outputs.cache-hit != 'true' || inputs.bypass-asset-cache == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate world map assets
        uses: ./.github/actions/generate-world-map-assets
        with:
          save: "true"
          bypass-cache: ${{ inputs.bypass-asset-cache }}
