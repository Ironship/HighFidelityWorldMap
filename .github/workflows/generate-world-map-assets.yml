name: Generate World Map Assets

# Runs the Python pipeline (src/generator/generateHFWM.py) that builds the Art
# addon's content, the World and continent maps (src/addon/art/WorldMap/), and
# saves it to the Actions cache *from main*. That is the only scope a
# tag-triggered release can read, so every release (Create Release: Art and
# Publish Art Release to CurseForge) can reuse it instead of repeating the
# ~40 minute generation. See .github/actions/generate-world-map-assets.
#
# One cache entry, the art (mapart-v2-<hash>, ~1 GB). The hash covers the
# generator only (src/generator/generateHFWM.py, src/generator/hfwm/**,
# src/generator/requirements.txt). A change that leaves those alone, such as an
# addon Lua fix, docs or a workflow tweak, resolves to the same key, so a new
# tag or manual release reuses the existing art without regenerating anything.
#
#   - weekly: GitHub evicts caches unused for 7 days; restoring the entry
#     resets that clock. A miss here (evicted, or never built) regenerates it.
#   - manual: warm it on demand.
#
# A manual "Create Release: Art" run is on main, so it also saves what it
# generates to the cache scope later releases read.

on:
  schedule:
    - cron: "17 4 * * 0"
  workflow_dispatch:
    inputs:
      bypass-asset-cache:
        description: "Bypass the asset cache and regenerate from scratch."
        required: false
        type: boolean
        default: false
  # Called by publish-art-release-curseforge.yml so the build is jobs of that run.
  workflow_call:
    inputs:
      bypass-asset-cache:
        description: "Bypass the asset cache and regenerate from scratch."
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: generate-world-map-assets
  cancel-in-progress: false

jobs:
  cache-check:
    name: Check world map asset cache
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.art.outputs.cache-hit == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Compute cache keys
        id: key
        env:
          HASH: ${{ hashFiles('src/generator/generateHFWM.py', 'src/generator/hfwm/**/*.py', 'src/generator/requirements.txt') }}
        run: .github/scripts/world-map-assets-keys.sh >> "$GITHUB_OUTPUT"

      # Only the weekly run downloads the ~1 GB art, to reset the eviction
      # clock (a real restore: restoring an entry is what resets GitHub's
      # 7-day clock). Otherwise (a release calling this, a manual warm-up) this
      # only has to know the entry exists; the job that uses the art restores
      # it itself, so downloading it here too just doubles the time.
      - name: Restore world map art cache
        id: art
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.bypass-asset-cache }}
        uses: actions/cache/restore@v5
        with:
          lookup-only: ${{ github.event_name != 'schedule' }}
          path: src/addon/art/WorldMap
          key: ${{ steps.key.outputs.art-key }}

  build:
    name: Generate and cache world map assets
    needs: cache-check
    if: ${{ needs.cache-check.outputs.cache-hit != 'true' || inputs.bypass-asset-cache == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate world map assets
        uses: ./.github/actions/generate-world-map-assets
        with:
          save: "true"
          bypass-cache: ${{ inputs.bypass-asset-cache }}
