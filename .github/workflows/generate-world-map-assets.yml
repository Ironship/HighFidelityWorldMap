name: Generate World Map Assets

# Runs the Python pipeline (src/generator/generateHFWM.py) that builds the world
# map art, src/addon/FDIDMap.lua and src/addon/CaveData.lua, and saves the result to the Actions cache *from
# main*. That is the only scope a tag-triggered release can read, so every
# release, Create Release and the publish workflows alike, can reuse it instead
# of repeating the ~40 minute generation. See
# .github/actions/generate-world-map-assets.
#
# The cache key is a hash of the generator only (src/generator/generateHFWM.py,
# src/generator/hfwm/**, src/generator/requirements.txt). A change that leaves those alone, such as an addon Lua fix,
# docs or a workflow tweak, resolves to the same key, so a new tag or manual
# release reuses the existing assets without regenerating anything.
#
#   - push to main touching the generator: regenerate so the next release is a
#     cache hit.
#   - weekly: GitHub evicts caches unused for 7 days; restoring the entry
#     resets that clock. A miss here (evicted, or never built) regenerates it.
#   - manual: warm it on demand.

on:
  push:
    branches:
      - main
    paths:
      - "src/generator/**"
      - ".github/actions/generate-world-map-assets/**"
  schedule:
    - cron: "17 4 * * 0"
  workflow_dispatch:
    inputs:
      bypass-asset-cache:
        description: "Bypass the asset cache and regenerate from scratch."
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: generate-world-map-assets
  cancel-in-progress: false

jobs:
  build:
    name: Generate and cache world map assets
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate world map assets
        uses: ./.github/actions/generate-world-map-assets
        with:
          save: "true"
          bypass-cache: ${{ inputs.bypass-asset-cache }}
