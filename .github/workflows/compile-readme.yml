name: Compile README.md

on:
  push:
    branches:
      - main
    paths:
      - docs/DESCRIPTION.md
      - docs/BUILDING.md
      - .github/scripts/generate_readme.py
      - .github/scripts/commit-readme.sh
      - .github/workflows/compile-readme.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-readme:
    name: Regenerate root README
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Regenerate root README
        run: python .github/scripts/generate_readme.py
