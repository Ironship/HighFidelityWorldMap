name: Compile README.md

on:
  push:
    branches:
      - main
    paths:
      - docs/DESCRIPTION.md
      - docs/BUILDING.md
      - .github/scripts/generate_readme.py
      - .github/scripts/commit-readme.sh
      - .github/workflows/compile-readme.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile-readme:
    name: Regenerate root README
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Mint HFWM-GHA app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.HFWM_GHA_CLIENT_ID }}
          private-key: ${{ secrets.HFWM_GHA_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Regenerate root README
        run: python .github/scripts/generate_readme.py

      - name: Commit and push README if changed
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if git diff --quiet -- README.md; then
            echo "README.md already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Generate README from docs"
          git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push
