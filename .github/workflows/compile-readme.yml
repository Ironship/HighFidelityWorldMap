name: Compile README.md

on:
  push:
    branches:
      - main
    paths:
      - docs/DESCRIPTION.md
      - docs/BUILDING.md
      - .github/scripts/generate_readme.py
      - .github/scripts/commit-readme.sh
      - .github/workflows/compile-readme.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile-readme:
    name: Regenerate root README
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.HFWP_GHA_CLIENT_ID }}
          private-key: ${{ secrets.HFWM_GHA_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Regenerate root README
        run: python .github/scripts/generate_readme.py

      - name: Commit generated README
        run: .github/scripts/commit-readme.sh
