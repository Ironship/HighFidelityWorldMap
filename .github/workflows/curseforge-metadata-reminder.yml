name: CurseForge metadata reminder

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - ready_for_review
    paths:
      - docs/DESCRIPTION.md
      - assets/images/icon.png
      - .github/scripts/curseforge-metadata-pr-task.sh
      - .github/workflows/curseforge-metadata-reminder.yml

permissions:
  contents: read
  pull-requests: write

jobs:
  remind:
    name: Confirm CurseForge metadata follow-up
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Require PR task when metadata changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: .github/scripts/curseforge-metadata-pr-task.sh
