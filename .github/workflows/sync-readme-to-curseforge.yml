name: Sync README to CurseForge

on:
  push:
    branches:
      - main
    paths:
      - README.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-description:
    name: Update project description
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Update CurseForge project description
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_MOD_ID: ${{ vars.CF_MOD_ID || '1701034' }}
        run: python .github/scripts/update_curseforge_description.py
