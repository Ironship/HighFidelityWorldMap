name: "Create Release: Addon"

# Creates an official tagged release of the core addon (Lua only, small): the
# version tag, the package and the GitHub Release with the zip attached. The
# package step itself uploads nowhere else; the last job then starts "Publish
# Release to all Marketplaces" with the new tag. If that fails, re-run it on its
# own (or run "Publish Release to CurseForge") and give it the tag.
#
# The map art is NOT part of this release. It is the separate Map Data addon,
# released by "Create Release: MapData" with its own mapdata-v* tags and its own
# CurseForge project. The two workflows are independent and do not trigger each
# other, so a UI or settings fix never means a multi-GB download.
#
# Two ways in:
#
#   1. Push a tag yourself:  git tag -a v1.0.1 -m v1.0.1 && git push origin v1.0.1
#   2. Actions -> Create Release: Addon -> Run workflow, pick patch/minor/major
#      and the tag is created for you.
#
# Option 2 deliberately tags and packages inside this one workflow. A tag pushed
# with GITHUB_TOKEN does not trigger other workflows, so chaining two workflows
# would silently do nothing.
#
# Four jobs, so a failure late on does not redo an earlier part:
#
#   art      makes sure the generated Lua tables (FDIDMap.lua, CaveData.lua) are
#            available. Normally a small cache restore; the art itself is never
#            downloaded here.
#   tag      (manual runs only) bumps the version and pushes the tag
#   release  checks MapData is current, packages and creates the GitHub Release
#   publish  starts "Publish Release to all Marketplaces" and waits for it
#
# The release job refuses to ship when the generator changed and the Map Data
# addon has not been released from it yet (verify-mapdata-current.sh): the tables
# would point at art users cannot download. Wait for "Create Release: MapData"
# (or run it), then use "Re-run failed jobs" here; the tag is not bumped again.
#
# If release or publish fails (GitHub outage, ...), fix it and use "Re-run
# failed jobs": the jobs before it are not repeated, and a re-run does not bump
# the version a second time.

on:
  create:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to bump"
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
      prerelease:
        description: 'Optional suffix, e.g. "beta.1" -> v1.0.1-beta.1. A tag containing "beta" or "alpha" is marked as a pre-release, and is published to that CurseForge channel.'
        type: string
        required: false
        default: ""

permissions:
  contents: write

# Never run two addon releases at once. Independent of the MapData release.
concurrency:
  group: release-addon
  cancel-in-progress: false

jobs:
  art:
    name: Prepare generated Lua tables
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
      || (
        github.event_name == 'create'
        && github.ref_type == 'tag'
        && startsWith(github.ref, 'refs/tags/v')
      )
    runs-on: ubuntu-latest
    # actions: write lets it start generate-world-map-assets.yml.
    permissions:
      contents: read
      actions: write
    # A cache miss regenerates everything (phase 3 runs twice: art + Original/),
    # so give it plenty of room.
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        if: github.event_name == 'create'
        run: .github/scripts/verify-tag-on-main.sh

      # If main's cache has no tables for this generator code, run the Generate
      # World Map Assets workflow on main (so the build is visible there) and
      # wait for it. A release that only changes Lua/docs finds the cache and
      # skips this entirely. Only the tables are required: the art is the Map
      # Data addon's business.
      - name: Generate World Map Assets?
        env:
          GH_TOKEN: ${{ github.token }}
          ART_KEY: mapart-v2-${{ hashFiles('src/generator/generateHFWM.py', 'src/generator/hfwm/**/*.py', 'src/generator/requirements.txt') }}
          REQUIRE: tables
        run: .github/scripts/ensure-world-map-assets-cache.sh

      # Fallback: if the key above still misses (the tag's generator differs
      # from main's), build it here and save it for this run. Only a copy saved
      # from main is visible to *later* tags; see
      # .github/workflows/generate-world-map-assets.yml.
      - name: Generate world map assets
        uses: ./.github/actions/generate-world-map-assets
        with:
          save: "true"
          tables-only: "true"

  tag:
    name: Bump version and push tag
    needs: art
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.bump.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: .github/scripts/bump-version.sh

  release:
    name: Package and create GitHub release
    needs: [art, tag]
    # tag is skipped on a pushed-tag release; that is fine. A failed art or
    # tag job is not.
    if: ${{ !cancelled() && needs.art.result == 'success' && needs.tag.result != 'failure' }}
    runs-on: ubuntu-latest
    # A vanished cache entry means regenerating here, so keep the long limit.
    timeout-minutes: 300
    env:
      # Empty on a pushed-tag release, where the tag is the triggering ref.
      RELEASE_TAG: ${{ needs.tag.outputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Empty on a pushed-tag release, which means the triggering ref.
          ref: ${{ needs.tag.outputs.tag }}
          # release.sh walks back through tags to build the changelog, and
          # verify-mapdata-current.sh reads the mapdata-v* tags.
          fetch-depth: 0

      # Normally a straight cache hit from the art job. If the cache entry
      # vanished or failed to save, this rebuilds rather than failing.
      - name: Generate world map assets
        id: assets
        uses: ./.github/actions/generate-world-map-assets
        with:
          tables-only: "true"

      # Needs the mapdata-v* tags, so it comes before isolate-tag-series.sh
      # deletes them.
      - name: Verify Map Data is current
        env:
          ART_KEY: ${{ steps.assets.outputs.art-key }}
        run: .github/scripts/verify-mapdata-current.sh

      # release.sh excludes anything `git ls-files --others` reports, which
      # includes .gitignored paths. The generated tables are tracked, but
      # adding them to the index with --intent-to-add (-N) keeps the packager
      # shipping the regenerated copies without writing blobs into .git. The
      # index is thrown away with the runner; nothing is committed.
      - name: Stage generated tables
        run: git add -fN src/addon/client/FDIDMap.lua src/addon/client/CaveData.lua

      # The packager has no tag-prefix option: its changelog uses "the previous
      # tag" among all tags. Hide the MapData series from it.
      - name: Isolate the v* tag series
        run: .github/scripts/isolate-tag-series.sh v

      # The packager only uploads to a destination whose token is set. Only
      # GITHUB_OAUTH is passed here, so this creates the GitHub Release and
      # skips CurseForge; publish-curseforge.yml is the one that sets
      # CF_API_TOKEN.
      - name: Package and create GitHub release
        uses: BigWigsMods/packager@v2
        with:
          # Nothing goes to WoWInterface, so skip the pandoc install.
          pandoc: "false"
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

      # The packager creates the Release and may mark it Latest, but a Map Data
      # release published afterwards would take that over. The addon is what
      # people download from the Releases page. GitHub does not allow a
      # pre-release to be Latest, so only stable tags.
      - name: Mark as latest release
        if: ${{ !contains(env.RELEASE_TAG, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --latest

      # Redundant once the GitHub Release exists, but it is the only copy of the
      # zip if the Release upload is what failed.
      - name: Upload package
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: package
          path: .release/*.zip
          if-no-files-found: warn
          retention-days: 7

  publish:
    name: Publish to all marketplaces
    needs: [tag, release]
    # Only once the GitHub Release exists, which publish-all.yml checks for.
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    # actions: write lets it start publish-all.yml.
    permissions:
      contents: read
      actions: write
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Dispatched rather than called, so it is a run of its own workflow and
      # can be re-run from there. The tag is the one just created by a manual
      # run, or the pushed tag itself.
      - name: Publish to all marketplaces
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.tag.outputs.tag || github.ref_name }}
        run: .github/scripts/dispatch-workflow-and-wait.sh publish-all.yml -f "tag=${RELEASE_TAG}"
