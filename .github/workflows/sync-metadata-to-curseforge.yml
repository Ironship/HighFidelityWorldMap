name: Sync metadata to CurseForge

on:
  push:
    branches:
      - main
    paths:
      - docs/DESCRIPTION.md
      - assets/images/logo.png
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-metadata:
    name: Update project metadata
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Update CurseForge metadata
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_MOD_ID: ${{ vars.CF_MOD_ID || '1701034' }}
        run: python .github/scripts/update_curseforge_description.py
