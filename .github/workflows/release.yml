name: Release

# Two ways in:
#
#   1. Push a tag yourself:  git tag -a v1.0.1 -m v1.0.1 && git push origin v1.0.1
#   2. Actions -> Release -> Run workflow, pick patch/minor/major and the tag is
#      created for you.
#
# Option 2 deliberately tags and packages inside this one workflow. A tag pushed
# with GITHUB_TOKEN does not trigger other workflows, so chaining two workflows
# would silently do nothing.
#
# Three jobs, so a failure late on does not redo the expensive part:
#
#   art      generates the map art (~40 min) and saves it to the Actions cache
#   tag      (manual runs only) bumps the version and pushes the tag
#   publish  restores the art, packages, uploads to CurseForge and GitHub
#
# If publish fails (bad CF_API_TOKEN, CurseForge outage, ...), fix it and use
# "Re-run failed jobs": art and tag are not repeated, and a re-run does not bump
# the version a second time.

on:
  create:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to bump"
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
      prerelease:
        description: 'Optional suffix, e.g. "beta.1" -> v1.0.1-beta.1. A tag containing "beta" or "alpha" uploads to that CurseForge channel.'
        type: string
        required: false
        default: ""

permissions:
  contents: write

# A release pushes a multi-GB zip to CurseForge; never run two at once.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  art:
    name: Generate map art
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
      || (
        github.event_name == 'create'
        && github.ref_type == 'tag'
        && startsWith(github.ref, 'refs/tags/v')
      )
    runs-on: ubuntu-latest
    # A cache miss regenerates the art (phase 3 runs twice: art + Original/),
    # so give it plenty of room.
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        if: github.event_name == 'create'
        run: .github/scripts/verify-tag-on-main.sh

      # Reuses the art from the last build of the same generator code, so a
      # release that only changes Lua/docs skips the long generation entirely.
      # Always saves, so the publish job (and a re-run of it) can pick the art
      # up. Only a copy saved from main is visible to *later* tags; see
      # .github/workflows/map-art.yml. lookup-only: on a hit there is nothing
      # to do here, so don't download GBs just for publish to download them again.
      - name: Map art
        uses: ./.github/actions/map-art
        with:
          save: "true"
          lookup-only: "true"

  tag:
    name: Bump version and push tag
    needs: art
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.bump.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: .github/scripts/bump-version.sh

  publish:
    name: Package and publish
    needs: [art, tag]
    # tag is skipped on a pushed-tag release; that is fine. A failed art or
    # tag job is not.
    if: ${{ !cancelled() && needs.art.result == 'success' && needs.tag.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Empty on a pushed-tag release, which means the triggering ref.
          ref: ${{ needs.tag.outputs.tag }}
          # release.sh walks back through tags to build the changelog.
          fetch-depth: 0

      # Normally a straight cache hit from the art job. If the cache entry
      # vanished or failed to save, this rebuilds rather than failing.
      - name: Map art
        uses: ./.github/actions/map-art

      # release.sh excludes anything `git ls-files --others` reports, which
      # includes .gitignored paths — so the generated WorldMap/ would be
      # dropped from the zip. Adding it to the index with --intent-to-add (-N)
      # takes it off that list without writing GBs of blobs into .git. The
      # index is thrown away with the runner; nothing is committed.
      - name: Stage generated art
        run: git add -fN WorldMap FDIDMap.lua

      - name: Package and publish
        uses: BigWigsMods/packager@v2
        with:
          # Nothing goes to WoWInterface, so skip the pandoc install.
          pandoc: "false"
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

      # Redundant once the GitHub Release exists, but it is the only copy of the
      # zip if the CurseForge or Release upload is what failed.
      - name: Upload package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: .release/*.zip
          if-no-files-found: warn
          retention-days: 7
          # BLPs are already DXT-compressed; re-deflating them is wasted time.
          compression-level: 0
