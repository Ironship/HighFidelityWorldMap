name: Create Release

# Creates an official tagged release: the version tag, the map art, the package
# and the GitHub Release with the zip attached. It deliberately uploads nowhere
# else. To put a release on the marketplaces, run "Publish Release to all
# Marketplaces" (or "Publish Release to CurseForge") and give it the tag.
#
# Two ways in:
#
#   1. Push a tag yourself:  git tag -a v1.0.1 -m v1.0.1 && git push origin v1.0.1
#   2. Actions -> Create Release -> Run workflow, pick patch/minor/major and the
#      tag is created for you.
#
# Option 2 deliberately tags and packages inside this one workflow. A tag pushed
# with GITHUB_TOKEN does not trigger other workflows, so chaining two workflows
# would silently do nothing.
#
# Three jobs, so a failure late on does not redo the expensive part:
#
#   art      generates the map art (~40 min) and saves it to the Actions cache
#   tag      (manual runs only) bumps the version and pushes the tag
#   release  restores the art, packages and creates the GitHub Release
#
# If release fails (GitHub outage, ...), fix it and use "Re-run failed jobs":
# art and tag are not repeated, and a re-run does not bump the version a second
# time.

on:
  create:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to bump"
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
      prerelease:
        description: 'Optional suffix, e.g. "beta.1" -> v1.0.1-beta.1. A tag containing "beta" or "alpha" is marked as a pre-release, and is published to that CurseForge channel.'
        type: string
        required: false
        default: ""

permissions:
  contents: write

# A release builds and uploads a multi-GB zip; never run two at once.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  art:
    name: Generate map art
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
      || (
        github.event_name == 'create'
        && github.ref_type == 'tag'
        && startsWith(github.ref, 'refs/tags/v')
      )
    runs-on: ubuntu-latest
    # actions: write lets it start generate-world-map-assets.yml.
    permissions:
      contents: read
      actions: write
    # A cache miss regenerates the art (phase 3 runs twice: art + Original/),
    # so give it plenty of room.
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        if: github.event_name == 'create'
        run: .github/scripts/verify-tag-on-main.sh

      # If main's cache has no art for this generator code, run the Generate
      # World Map Assets workflow on main (so the build is visible there) and
      # wait for it. A release that only changes Lua/docs finds the cache and
      # skips this entirely.
      - name: Ensure world map assets are cached on main
        env:
          GH_TOKEN: ${{ github.token }}
          ART_KEY: mapart-v1-${{ hashFiles('generateHFWM.py', 'hfwm/**/*.py', 'requirements.txt') }}
        run: .github/scripts/ensure-world-map-assets-cache.sh

      # Fallback: if the key above still misses (the tag's generator differs
      # from main's), build it here and save it for this run. Only a copy saved
      # from main is visible to *later* tags; see
      # .github/workflows/generate-world-map-assets.yml. lookup-only: on a hit
      # there is nothing to do here, so don't download GBs just for publish to
      # download them again.
      - name: Generate world map assets
        uses: ./.github/actions/generate-world-map-assets
        with:
          save: "true"
          lookup-only: "true"

  tag:
    name: Bump version and push tag
    needs: art
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.bump.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: .github/scripts/bump-version.sh

  release:
    name: Package and create GitHub release
    needs: [art, tag]
    # tag is skipped on a pushed-tag release; that is fine. A failed art or
    # tag job is not.
    if: ${{ !cancelled() && needs.art.result == 'success' && needs.tag.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Empty on a pushed-tag release, which means the triggering ref.
          ref: ${{ needs.tag.outputs.tag }}
          # release.sh walks back through tags to build the changelog.
          fetch-depth: 0

      # Normally a straight cache hit from the art job. If the cache entry
      # vanished or failed to save, this rebuilds rather than failing.
      - name: Generate world map assets
        uses: ./.github/actions/generate-world-map-assets

      # release.sh excludes anything `git ls-files --others` reports, which
      # includes .gitignored paths — so the generated WorldMap/ would be
      # dropped from the zip. Adding it to the index with --intent-to-add (-N)
      # takes it off that list without writing GBs of blobs into .git. The
      # index is thrown away with the runner; nothing is committed.
      - name: Stage generated art
        run: git add -fN WorldMap FDIDMap.lua

      # The packager only uploads to a destination whose token is set. Only
      # GITHUB_OAUTH is passed here, so this creates the GitHub Release and
      # skips CurseForge; publish-curseforge.yml is the one that sets
      # CF_API_TOKEN.
      - name: Package and create GitHub release
        uses: BigWigsMods/packager@v2
        with:
          # Nothing goes to WoWInterface, so skip the pandoc install.
          pandoc: "false"
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

      # Redundant once the GitHub Release exists, but it is the only copy of the
      # zip if the Release upload is what failed.
      - name: Upload package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: .release/*.zip
          if-no-files-found: warn
          retention-days: 7
          # BLPs are already DXT-compressed; re-deflating them is wasted time.
          compression-level: 0
