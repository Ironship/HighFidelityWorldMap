name: Release

# Two ways in:
#
#   1. Push a tag yourself:  git tag -a v1.0.1 -m v1.0.1 && git push origin v1.0.1
#   2. Actions -> Release -> Run workflow, pick patch/minor/major and the tag is
#      created for you.
#
# Option 2 deliberately tags *and* packages in the same job. A tag pushed with
# GITHUB_TOKEN does not trigger other workflows, so chaining two workflows would
# silently do nothing.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to bump"
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
      prerelease:
        description: 'Optional suffix, e.g. "beta.1" -> v1.0.1-beta.1. A tag containing "beta" or "alpha" uploads to that CurseForge channel.'
        type: string
        required: false
        default: ""

permissions:
  contents: write

# A release pushes ~350 MB to CurseForge; never run two at once.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    # Phase 3 runs twice (art + Original/), so give it plenty of room.
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # release.sh walks back through tags to build the changelog.
          fetch-depth: 0

      - name: Bump version and push tag
        if: github.event_name == 'workflow_dispatch'
        env:
          BUMP: ${{ inputs.bump }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          latest="$(git tag -l 'v[0-9]*' --sort=-v:refname | head -n1)"
          if [[ -z "$latest" ]]; then
            base="0.1.0"
          else
            # Strip the leading v and any -prerelease suffix.
            core="${latest#v}"
            core="${core%%-*}"
            IFS=. read -r major minor patch <<< "$core"
            major="${major:-0}"; minor="${minor:-0}"; patch="${patch:-0}"
            case "$BUMP" in
              major) base="$((major + 1)).0.0" ;;
              minor) base="${major}.$((minor + 1)).0" ;;
              patch) base="${major}.${minor}.$((patch + 1))" ;;
              *) echo "::error::unknown bump '$BUMP'"; exit 1 ;;
            esac
          fi

          next="v${base}"
          if [[ -n "$PRERELEASE" ]]; then
            next="${next}-${PRERELEASE#-}"
          fi

          if git rev-parse -q --verify "refs/tags/$next" >/dev/null; then
            echo "::error::tag $next already exists"
            exit 1
          fi

          echo "Previous tag: ${latest:-<none>}  ->  new tag: $next"
          echo "### Releasing \`$next\` (previous: \`${latest:-none}\`)" >> "$GITHUB_STEP_SUMMARY"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Annotated: release.sh only recognises annotated tags as versions.
          git tag -a "$next" -m "$next"
          git push origin "refs/tags/$next"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Resolve game build
        id: pipeline
        run: |
          set -euo pipefail
          python - >> "$GITHUB_OUTPUT" <<'PY'
          from hfwm.constants import GAME_BUILD, GAME_PRODUCT
          print(f"build={GAME_BUILD}")
          print(f"cache_dir=.cache-{GAME_PRODUCT}-{GAME_BUILD}")
          PY

      # ~270 MB of DB2 exports, WDTs and minimap BLPs pulled from wago.tools.
      # Caching it turns the download phase into a no-op on later releases.
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pipeline.outputs.cache_dir }}
          key: casc-${{ steps.pipeline.outputs.build }}-${{ hashFiles('hfwm/constants.py') }}
          restore-keys: |
            casc-${{ steps.pipeline.outputs.build }}-

      - name: Generate map art
        run: python generateHFWM.py ./WorldMap

      - name: Verify map art
        run: |
          set -euo pipefail

          # Count the two trees separately. A single total lets one of them
          # cover for the other: when every zone in phase 3 died and only the
          # Original/ dump succeeded, the combined figure still looked like a
          # half-finished build rather than a total failure of the art the
          # addon actually ships.
          # One find over the whole tree, split after the fact. Pointing find
          # at WorldMap/Original directly would exit non-zero when the dump is
          # missing, and pipefail turns that into a dead step before it can say
          # anything useful — which is the case worth reporting clearly. Counted
          # into an array rather than with `grep -c` because an empty result is
          # still one empty line, which would report 1 for a build that produced
          # nothing whatsoever.
          mapfile -t blps < <(find WorldMap -type f -name '*.blp')
          main=0
          orig=0
          for f in ${blps[@]+"${blps[@]}"}; do
            case "$f" in
              WorldMap/Original/*) orig=$((orig + 1)) ;;
              *)                   main=$((main + 1)) ;;
            esac
          done
          echo "Generated $main BLPs + $orig raw, $(du -sh WorldMap | cut -f1) total."

          # A full build is ~687 tiles per tree. Anything far below that means
          # zones failed and the package would ship with holes in it.
          status=0
          if (( main < 650 )); then
            echo "::error::only $main BLPs in WorldMap/, expected ~687 — refusing to publish an incomplete map"
            status=1
          fi
          # Generated with --original on, so an empty Original/ is a failure
          # too: FDIDMap.lua would ship the background with no textures.
          if (( orig < 650 )); then
            echo "::error::only $orig BLPs in WorldMap/Original/, expected ~687 — the in-game Original background would have no art"
            status=1
          fi
          test -s FDIDMap.lua
          # Both tables have to be populated, or the addon silently drops a
          # background that the TOC and the options panel still advertise.
          grep -q '^HFWMF_FDID_MAP_ORIGINAL = {$' FDIDMap.lua || {
            echo "::error::FDIDMap.lua has no populated HFWMF_FDID_MAP_ORIGINAL table"
            status=1
          }
          exit $status

      # release.sh excludes anything `git ls-files --others` reports, which
      # includes .gitignored paths — so the freshly generated WorldMap/ would be
      # dropped from the zip. Adding it to the index with --intent-to-add (-N)
      # takes it off that list without writing 350 MB of blobs into .git. The
      # index is thrown away with the runner; nothing is committed.
      - name: Stage generated art
        run: git add -fN WorldMap FDIDMap.lua

      - name: Package and publish
        uses: BigWigsMods/packager@v2
        with:
          # Nothing goes to WoWInterface, so skip the pandoc install.
          pandoc: "false"
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

      # Redundant once the GitHub Release exists, but it is the only copy of the
      # zip if the CurseForge or Release upload is what failed.
      - name: Upload package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: .release/*.zip
          if-no-files-found: warn
          retention-days: 7
          # BLPs are already DXT-compressed; re-deflating them is wasted time.
          compression-level: 0
