name: Validate Changes

# Cheap checks on PRs into main and on manual dispatch. Deliberately does not
# run on pushes to main: anything that reached main already passed as a PR.
# Also does *not* generate the map art — that is a multi-GB job and belongs
# only in Generate World Map Assets and Create Release.

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: validate-changes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect generator changes
    runs-on: ubuntu-latest
    outputs:
      generator: ${{ steps.filter.outputs.generator }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            generator:
              - 'src/generator/**'
              - '.github/workflows/validate-changes.yml'
              - '.github/scripts/smoke-test.sh'

  lua:
    name: Lint addon Lua
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Lua
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1

      # Same script a contributor runs locally. Fetches from a GitHub
      # mirror (see the script's own comment for why), not the svn trunk
      # .pkgmeta's externals use for the actual release, so a renamed or
      # broken path there fails here rather than silently at release time.
      - name: Fetch Ace3 libraries
        run: ./src/addon/dev/fetch-libs.sh

      # Covers the files listed in the TOC and the fetched Ace3 libraries.
      - name: Lint Lua
        run: .github/scripts/lint-lua.sh

  python:
    name: Test map generator
    needs: changes
    # A manual run has no meaningful diff to filter on, so always test.
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.generator == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: .github/scripts/install-python-deps.sh

      - name: Lint Python
        run: python -m compileall -q generator

      # Hits wago.tools for the DB2 exports but writes no tiles. Catches a
      # pinned build going away or the zone DB changing shape.
      - name: Dry run generator
        run: python src/generator/generateHFWM.py --dry-run

      # The dry run stops before a single pixel is touched, so it never
      # imports what the processing phase needs — a missing numpy got all the
      # way to a release before anything noticed. One interior zone is four
      # source tiles and about a second, and it runs the whole path: download,
      # stitch, the sea erase, the resample, BLP2 encode.
      #
      # --skip-fdid-map because phase 4 writes src/addon/FDIDMap.lua rather than
      # into the output dir, and a one-zone map would overwrite the committed
      # one.
      - name: Smoke test
        run: .github/scripts/smoke-test.sh

      # ThunderBluff is landlocked, so the run above never reaches the ocean
      # pass's cell classification. Same zone, other code path.
      - name: Smoke test (ocean pass)
        run: .github/scripts/smoke-test.sh ocean

  package:
    name: Validate package config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # -d skips uploading, -z skips zip creation: validates the TOC, the
      # .pkgmeta and the changelog without building or publishing anything.
      - name: Validate package config
        uses: BigWigsMods/packager@v2
        with:
          args: -d -z
          pandoc: "false"
