name: "Create Release: Client"

# Creates an official tagged release of the core client addon (Lua only, small): the
# version tag, the package and the GitHub Release with the zip attached. The
# package step itself uploads nowhere else; the last job then starts "Publish
# Release to all Marketplaces" with the new tag. If that fails, re-run it on its
# own (or run "Publish Release to CurseForge") and give it the tag.
#
# The map art and runtime map metadata are NOT part of this release. They are
# the separate Map Data addon, released by "Create Release: MapData" with its
# own mapdata-v* tags and its own CurseForge project. The client addon only ships
# the Lua/UI logic; it consumes the data addon's bridge and art at runtime.
#
# Two ways in:
#
#   1. Push a tag yourself:  git tag -a v1.0.1 -m v1.0.1 && git push origin v1.0.1
#   2. Actions -> Create Release: Addon -> Run workflow, pick patch/minor/major
#      and the tag is created for you.
#
# Option 2 deliberately tags and packages inside this one workflow. A tag pushed
# with GITHUB_TOKEN does not trigger other workflows, so chaining two workflows
# would silently do nothing.
#
# Three jobs, so a failure late on does not redo an earlier part:
#
#   tag      (manual runs only) bumps the version and pushes the tag
#   release  packages and creates the GitHub Release from the checked-in client
#            source only
#   publish  starts "Publish Release to all Marketplaces" and waits for it
#
# If release or publish fails (GitHub outage, ...), fix it and use "Re-run
# failed jobs": the jobs before it are not repeated, and a re-run does not bump
# the version a second time.

on:
  create:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to bump"
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
      prerelease:
        description: 'Optional suffix, e.g. "beta.1" -> v1.0.1-beta.1. A tag containing "beta" or "alpha" is marked as a pre-release, and is published to that CurseForge channel.'
        type: string
        required: false
        default: ""

permissions:
  contents: write

# Never run two addon releases at once. Independent of the MapData release.
concurrency:
  group: release-addon-client
  cancel-in-progress: false

jobs:
  tag:
    name: Bump version and push tag
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.bump.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: .github/scripts/bump-version.sh

  release:
    name: Package and create GitHub release
    needs: tag
    # tag is skipped on a pushed-tag release; that is fine. A failed tag job is not.
    if: ${{ !cancelled() && needs.tag.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      # Empty on a pushed-tag release, where the tag is the triggering ref.
      RELEASE_TAG: ${{ needs.tag.outputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Empty on a pushed-tag release, which means the triggering ref.
          ref: ${{ needs.tag.outputs.tag }}
          fetch-depth: 0

      # The core addon is Lua-only. The Map Data addon owns the generated map
      # art and runtime bridge, so the client release packages the checked-in
      # source as-is and never invokes the world-map asset generator.

      # The packager has no tag-prefix option: its changelog uses "the previous
      # tag" among all tags. Hide the MapData series from it.
      - name: Isolate the v* tag series
        run: .github/scripts/isolate-tag-series.sh v

      # The packager only uploads to a destination whose token is set. Only
      # GITHUB_OAUTH is passed here, so this creates the GitHub Release and
      # skips CurseForge; publish-curseforge.yml is the one that sets
      # CF_API_TOKEN.
      - name: Package and create GitHub release
        uses: BigWigsMods/packager@v2
        with:
          # Nothing goes to WoWInterface, so skip the pandoc install.
          pandoc: "false"
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

      # The packager creates the Release and may mark it Latest, but a Map Data
      # release published afterwards would take that over. The addon is what
      # people download from the Releases page. GitHub does not allow a
      # pre-release to be Latest, so only stable tags.
      - name: Mark as latest release
        if: ${{ !contains(env.RELEASE_TAG, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --latest

      # Redundant once the GitHub Release exists, but it is the only copy of the
      # zip if the Release upload is what failed.
      - name: Upload package
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: package
          path: .release/*.zip
          if-no-files-found: warn
          retention-days: 7

  publish:
    name: Publish to all marketplaces
    needs: [tag, release]
    # Only once the GitHub Release exists, which publish-all.yml checks for.
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    # actions: write lets it start publish-all.yml.
    permissions:
      contents: read
      actions: write
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Dispatched rather than called, so it is a run of its own workflow and
      # can be re-run from there. The tag is the one just created by a manual
      # run, or the pushed tag itself.
      - name: Publish to all marketplaces
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.tag.outputs.tag || github.ref_name }}
        run: .github/scripts/dispatch-workflow-and-wait.sh publish-all.yml -f "tag=${RELEASE_TAG}"
