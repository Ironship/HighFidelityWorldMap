name: CI

# Cheap checks on every push and PR. Deliberately does *not* generate the map
# art — that is a ~350 MB job and belongs only in the release workflow.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect generator changes
    runs-on: ubuntu-latest
    outputs:
      generator: ${{ steps.filter.outputs.generator }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            generator:
              - 'generateHFWM.py'
              - 'hfwm/**'
              - 'requirements.txt'
              - '.github/workflows/ci.yml'

  lua:
    name: Lua
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Lua
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1

      # Same script a contributor runs locally. Fetches from a GitHub
      # mirror (see the script's own comment for why), not the svn trunk
      # .pkgmeta's externals use for the actual release, so a renamed or
      # broken path there fails here rather than silently at release time.
      - name: Fetch Ace3 libraries
        run: ./dev/fetch-libs.sh

      - name: Lint Lua
        run: |
          set -euo pipefail
          status=0
          # Read the file list out of the TOC so a file added to the repo but
          # never wired into the TOC does not silently pass.
          while IFS= read -r file; do
            [[ -f "$file" ]] || { echo "::error::$file is in the TOC but missing"; status=1; continue; }
            [[ "$file" == *.lua ]] || continue
            luac5.1 -p "$file" || status=1
          done < <(grep -E '^[^#[:space:]].*\.(lua|xml)[[:space:]]*$' HighFidelityWorldMapForever.toc | tr -d '\r')
          exit $status

      - name: Lint fetched Ace3 libraries
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r file; do
            luac5.1 -p "$file" || status=1
          done < <(find Libs -name '*.lua')
          exit $status

  python:
    name: Generator
    needs: changes
    if: needs.changes.outputs.generator == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Lint Python
        run: python -m compileall -q hfwm generateHFWM.py

      # Hits wago.tools for the DB2 exports but writes no tiles. Catches a
      # pinned build going away or the zone DB changing shape.
      - name: Dry run generator
        run: python generateHFWM.py ./WorldMap --dry-run

      # The dry run stops before a single pixel is touched, so it never
      # imports what the processing phase needs — a missing numpy got all the
      # way to a release before anything noticed. One interior zone is four
      # source tiles and about a second, and it runs the whole path: download,
      # stitch, the sea erase, the resample, BLP2 encode.
      #
      # --skip-fdid-map because phase 4 writes FDIDMap.lua next to the script
      # rather than into the output dir, and a one-zone map would overwrite the
      # committed one.
      - name: Smoke test
        run: |
          set -euo pipefail
          python generateHFWM.py ./smoke --zones ThunderBluff --skip-fdid-map
          count="$(find smoke -type f -name '*.blp' | wc -l)"
          echo "Smoke build produced $count BLPs."
          # 12 for the zone, 12 again for the Original/ dump.
          if (( count != 24 )); then
            echo "::error::expected 24 BLPs from the smoke build, got $count"
            exit 1
          fi

      # ThunderBluff is landlocked, so the run above never reaches the ocean
      # pass's cell classification. Same zone, other code path.
      - name: Smoke test (ocean pass)
        run: |
          set -euo pipefail
          python generateHFWM.py ./smoke-ocean --zones ThunderBluff \
            --ocean --no-original --skip-fdid-map
          test "$(find smoke-ocean -type f -name '*.blp' | wc -l)" -eq 12

  package:
    name: Packager
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # -d skips uploading, -z skips zip creation: validates the TOC, the
      # .pkgmeta and the changelog without building or publishing anything.
      - name: Validate package config
        uses: BigWigsMods/packager@v2
        with:
          args: -d -z
          pandoc: "false"
