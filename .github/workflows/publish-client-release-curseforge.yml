name: Publish Client Release to CurseForge

# Uploads an existing release (v1.2.3) to CurseForge. It never creates tags or
# GitHub Releases; run "Create Release: Client" first.
#
# Run it on its own from the Actions tab, or let "Create Release: Client" call
# it.
#
# The package is rebuilt from the release tag rather than downloaded from the
# GitHub Release: the packager is what turns the TOC and tag into CurseForge
# game versions and a release channel (release/beta/alpha), and it cannot
# upload a zip it did not build. The generated art and tables are a pure
# function of the generator code at that tag, so the result matches what the
# Create Release workflow shipped.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, as shown on the Releases page, e.g. v1.0.1"
        type: string
        required: true
  workflow_call:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v1.0.1"
        type: string
        required: true
    secrets:
      CF_API_TOKEN:
        required: true

permissions:
  contents: read
  checks: write

# A publish can upload a multi-GB zip to CurseForge; never run two at once.
concurrency:
  group: publish-client-release-curseforge
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    # The workflow file and CF_API_TOKEN are only trusted from main. In a called
    # workflow github.ref is the caller's ref: main for a manual release, or the
    # pushed release tag itself, whose commit "Verify tag is on main" below
    # requires to be on main.
    if: github.ref == 'refs/heads/main' || github.ref == format('refs/tags/{0}', inputs.tag)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The value is not echoed back: it is free text from a workflow input.
      - name: Verify tag is a release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::The release tag must look like v1.2.3 or v1.2.3-beta.1"
            exit 1
          fi

      - name: Verify release exists
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/verify-release-exists.sh

      - name: Verify tag is on main
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: .github/scripts/verify-tag-on-main.sh

  assets:
    name: World map assets
    needs: verify
    # Called, not dispatched, so the build shows up as jobs of this run. It runs
    # on the caller's ref. On main that is the only scope a tag-triggered
    # release can read the cache from.
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/generate-world-map-assets.yml

  publish:
    name: Package and upload to CurseForge
    needs: [verify, assets]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    timeout-minutes: 300

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag }}
          # release.sh walks back through tags to build the changelog.
          fetch-depth: 0

      # The assets job above guarantees the cache holds the tables and art (a
      # hit when the generator has not changed, see
      # generate-world-map-assets.yml). Restoring them here is what puts them
      # in this workspace; a miss would rebuild, and saving means a re-run of
      # a failed upload does not rebuild it again.
      - name: Generate world map assets
        uses: ./.github/actions/generate-world-map-assets
        with:
          save: "true"

      # See release-addon-client.yml: takes the gitignored art off the packager's
      # exclude list without writing GBs of blobs into .git.
      - name: Stage generated art
        run: git add -fN src/addon/client/WorldMap

      # The packager has no tag-prefix option: its changelog uses "the previous
      # tag" among all tags. Hide the retired mapdata-v* series from it.
      - name: Isolate the v* tag series
        run: .github/scripts/isolate-tag-series.sh

      # Only CF_API_TOKEN is passed, so the packager uploads to CurseForge and
      # does not touch the GitHub Release. Nothing goes to WoWInterface, so skip
      # the pandoc install.
      - name: Package and upload to CurseForge
        uses: BigWigsMods/packager@v2
        with:
          pandoc: "false"
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
