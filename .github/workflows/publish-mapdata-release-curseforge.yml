name: Publish MapData Release to CurseForge

# Uploads an existing Map Data release (mapdata-v1.2.3) to CurseForge. It never
# creates tags or GitHub Releases; run "Create Release: MapData" first. The
# client addon has its own workflow: "Publish Client Release to CurseForge".
#
# Run it on its own from the Actions tab, or let "Create Release: MapData" call
# it. The TOC of the Map Data addon carries its own X-Curse-Project-ID, built
# with .pkgmeta-mapdata.
#
# The package is rebuilt from the release tag rather than downloaded from the
# GitHub Release: the packager is what turns the TOC and tag into CurseForge
# game versions and a release channel (release/beta/alpha), and it cannot
# upload a zip it did not build. The generated art is a pure function of the
# generator code at that tag, so the result matches what the Create Release
# workflow shipped.

on:
    workflow_dispatch:
        inputs:
            tag:
                description: "MapData release tag to publish, as shown on the Releases page, e.g. mapdata-v1.0.0"
                type: string
                required: true
    workflow_call:
        inputs:
            tag:
                description: "MapData release tag to publish, e.g. mapdata-v1.0.0"
                type: string
                required: true
        secrets:
            CF_API_TOKEN:
                required: true

permissions:
    contents: read
    checks: write

# A publish can upload a multi-GB zip to CurseForge; never run two at once.
concurrency:
    group: publish-mapdata-release-curseforge
    cancel-in-progress: false

jobs:
    verify:
        name: Verify release
        # The workflow file and CF_API_TOKEN are only trusted from main. In a called
        # workflow github.ref is the caller's ref, so this covers both entry points.
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            # The value is not echoed back: it is free text from a workflow input.
            - name: Verify tag is a MapData tag
              env:
                  RELEASE_TAG: ${{ inputs.tag }}
              run: |
                  if [[ ! "$RELEASE_TAG" =~ ^mapdata-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
                    echo "::error::The MapData release tag must look like mapdata-v1.2.3 or mapdata-v1.2.3-beta.1 (client releases use their own publish workflow)"
                    exit 1
                  fi

            - name: Verify release exists
              env:
                  RELEASE_TAG: ${{ inputs.tag }}
                  GH_TOKEN: ${{ github.token }}
              run: .github/scripts/verify-release-exists.sh

            - name: Verify tag is on main
              env:
                  RELEASE_TAG: ${{ inputs.tag }}
              run: .github/scripts/verify-tag-on-main.sh

    publish:
        name: Package and upload to CurseForge
        needs: verify
        runs-on: ubuntu-latest
        # actions: write lets it start generate-world-map-assets.yml.
        permissions:
            contents: read
            actions: write
            checks: write
        timeout-minutes: 300

        steps:
            - name: Checkout release tag
              uses: actions/checkout@v5
              with:
                  ref: refs/tags/${{ inputs.tag }}
                  # release.sh walks back through tags to build the changelog.
                  fetch-depth: 0

            # If main's cache is missing the tables or art this release ships, run the
            # Generate World Map Assets workflow on main (so the build is visible
            # there) and wait for it.
            - name: Generate World Map Assets?
              env:
                  GH_TOKEN: ${{ github.token }}
                  ART_KEY: mapart-v2-${{ hashFiles('src/generator/generateHFWM.py', 'src/generator/hfwm/**/*.py', 'src/generator/requirements.txt') }}
                  REQUIRE: all
              run: .github/scripts/ensure-world-map-assets-cache.sh

            # A hit when the generator has not changed since main last built it (see
            # generate-world-map-assets.yml). A miss rebuilds, and saving means a
            # re-run of a failed upload does not rebuild it again.
            - name: Generate world map assets
              id: assets
              uses: ./.github/actions/generate-world-map-assets
              with:
                  save: "true"

            # See release-addon-mapdata.yml: takes the gitignored art off the packager's
            # exclude list without writing GBs of blobs into .git. The TOC at the tag
            # is unstamped; the release workflow stamped its own copy, so this one
            # needs the same stamp.
            - name: Stage generated art
              run: git add -fN src/addon/mapdata/WorldMap

            - name: Stamp the TOC with the art build
              env:
                  ART_KEY: ${{ steps.assets.outputs.art-key }}
              run: .github/scripts/stamp-mapdata-toc.sh

            # The packager has no tag-prefix option: its changelog uses "the previous
            # tag" among all tags. Hide the client's series from it.
            - name: Isolate the mapdata-v* tag series
              run: .github/scripts/isolate-tag-series.sh mapdata-v

            # Only CF_API_TOKEN is passed, so the packager uploads to CurseForge and
            # does not touch the GitHub Release. Nothing goes to WoWInterface, so skip
            # the pandoc install. Keep the arguments in sync with
            # release-addon-mapdata.yml.
            - name: Package and upload to CurseForge
              uses: BigWigsMods/packager@v2
              with:
                  args: -m .pkgmeta-mapdata -n {package-name}-{project-version}:{project-version}
                  pandoc: "false"
              env:
                  CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
